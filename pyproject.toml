[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cedit"
version = "0.1.3"
description = "Continuous editing of vendored Markdown via 3-way structural merge"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Valentin Kantor", email = "kantorvv@gmail.com" }]
keywords = ["markdown", "merge", "vendoring", "three-way-merge", "mdformat"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control",
    "Topic :: Text Processing :: Markup :: Markdown",
]

# PINNED EXACTLY, and deliberately so — this is not a stale requirement file
# nobody got round to relaxing. Every hash in a consumer's `.cedit/` state
# (base doc hashes, overlay keys, conflict keys) is taken over the one parser
# configuration in `cedit/mdcore/utils.make_parser`, which *is* these
# packages. A `>=` or `~=` here would let a consumer's resolver install a
# different parser, silently move every recorded hash, and turn their next
# `sync` into a wall of false conflicts against blocks nobody touched. See
# invariant 2 in AGENTS.md; keep these identical to requirements.txt.
dependencies = [
    "markdown-it-py==4.2.0",
    "mdit-py-plugins==0.6.1",
    "mdformat==1.0.0",
    "mdformat-gfm==1.0.0",
    "mdformat-frontmatter==2.1.2",
    "linkify-it-py==2.1.0",
]

[project.urls]
Homepage = "https://github.com/sdlctools/cedit"
Repository = "https://github.com/sdlctools/cedit"
Documentation = "https://github.com/sdlctools/cedit/blob/main/USERGUIDE.md"
Issues = "https://github.com/sdlctools/cedit/issues"

[project.scripts]
cedit = "cedit.cli:main"

# Explicit, never auto-discovery: the repo root is a flat layout that also
# holds venv/, tests/ and conftest.py, and setuptools' flat-layout
# auto-discovery is fragile there. `cedit.mdcore` is not optional — it is the
# vendored parser every parse goes through, and a wheel without it is broken.
[tool.setuptools]
packages = ["cedit", "cedit.mdcore"]
