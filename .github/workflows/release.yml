# Tags and releases on every PR merge into main from a release/* or
# hotfix/* branch — SDLC §3 Phase 4 (release) and §4 (hotfix). Runs the full
# release sequence the policy mandates, in order:
#   1. resolve the version (release/* -> from the branch name; hotfix/* ->
#      latest v* tag + patch; a malformed release name fails the job — §5)
#   2. tag the merge commit vX.Y.Z (pure SemVer, no sprint suffix — §5 note)
#   3. publish the GitHub Release (= "deploy main to Production" — there's
#      no separate deploy step for this repo)
#   4. bump pyproject.toml on main, then build + verify the distribution
#   5. cut a Docusaurus docs version for vX.Y.Z on main (website/ only —
#      after the build, so invariant 6 in release-pipeline.md still holds)
#   6. back-merge main -> development  (§3 Phase 4 step 6 / §4 Step 4)
#   7. delete the release/hotfix branch (§3 Phase 4 step 7)
#   8. upload the built sdist + wheel to PyPI
#   9. (separate job) dispatch docs.yml against main to publish the site
#
# Only fires for release/* and hotfix/* head branches — a feature PR merged
# straight into main does NOT trigger a release (the `if:` guard below).
#
# Auth: main/development are protected by the "direct-commit-protect-main"
# ruleset (PR-only, no force-push/deletion), with the repo's Write role in
# its bypass list — that is what lets this job's default GITHUB_TOKEN push
# the version-bump commit and the back-merge straight to those branches.
#
# One case this job CANNOT complete: if the release changed a file under
# .github/workflows/, the back-merge commit updates one, and GitHub rejects
# the push ("refusing to allow a GitHub App to create or update workflow
# ... without `workflows` permission"). That is not a missing line in the
# permissions: block below — `workflows` is not a valid GITHUB_TOKEN
# permission key at all, and adding one makes this file fail validation so
# the workflow stops running entirely. Finish such a release by hand:
# see .claude/rules/manual-release.md. (A RELEASE_PAT with the `workflow`
# scope would also work, at the cost of a long-lived token in CI.)
#
# This workflow bumps pyproject.toml's version field and publishes the
# resulting sdist + wheel to PyPI via Trusted Publishing (OIDC) — no API
# token is stored in repository secrets. PyPI must have a *pending publisher*
# configured for this repository and this workflow file before the first
# release, or the publish step fails at the OIDC exchange; that is a human
# action on pypi.org which no change in this repo can cover.
#
# Only real releases reach PyPI. tag-development-rc.yml's vX.Y.Z-dev.N builds
# are deliberately not published.
name: Release

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write        # create tags + GitHub Releases
  pull-requests: write  # open the sync-back PR on conflict
  id-token: write       # OIDC token for PyPI Trusted Publishing

jobs:
  release:
    name: Tag, release, sync main -> development, cleanup
    runs-on: ubuntu-latest
    # Only real merges from a release/* or hotfix/* branch, never a closed
    # PR or a feature PR sneaking into main.
    if: >-
      github.event.pull_request.merged == true
      && (
        startsWith(github.event.pull_request.head.ref, 'release/')
        || startsWith(github.event.pull_request.head.ref, 'hotfix/')
      )
    steps:
      - name: Checkout merge commit (full history + tags)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: true   # default token pushes tags, releases, back-merge, branch delete

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Resolve version
        id: version
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          # Previous release on both paths: the most recent v*-prefixed tag
          # reachable from the merge commit. The Publish step passes this to
          # `gh release create --notes-start-tag` so the release notes start
          # from there.
          # --exclude '*-*' skips pre-release / dev-build tags (e.g.
          # vX.Y.Z-dev.N) so only strict stable tags count as the "previous
          # release".
          prev="$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' 2>/dev/null || true)"
          echo "prev=${prev}" >> "$GITHUB_OUTPUT"

          # The version comes from the head ref, by SDLC §5. The two branch
          # types differ only in how `next` is resolved; everything downstream
          # (tag, release, version bump, back-merge, branch delete) is shared.
          case "${HEAD_REF}" in
            release/*)
              # The branch name IS the source of truth — release.yml no longer
              # re-derives the version from the latest tag + a PR label. The
              # ONLY accepted form is release/sprint-<X.Y.Z> (no leading v);
              # this is what cut-release.yml produces and what SDLC §2 names.
              # One canonical spelling, one regex. A v-prefixed or otherwise
              # malformed name fails loudly — no fallback to tag arithmetic —
              # since the way to change a release's version is to rename or
              # re-cut the branch, not to relabel a PR (SDLC §5).
              if ! [[ "${HEAD_REF}" =~ ^release/sprint-([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
                echo "::error::Release branch '${HEAD_REF}' is not 'release/sprint-<X.Y.Z>' (no leading 'v' in the version). The branch name is the source of truth for the release version; rename or re-cut the branch."
                exit 1
              fi
              next="v${BASH_REMATCH[1]}"
              # Display-only bump kind (does NOT drive `next` — the branch name
              # does). 'initial' on the first release, when no prior tag exists.
              if [ -z "${prev}" ]; then
                level="initial"
              else
                pv="${prev#v}"; nv="${next#v}"
                pmj="${pv%%.*}"; rest="${pv#*.}"; pmn="${rest%%.*}"
                nmj="${nv%%.*}"; rest="${nv#*.}"; nmn="${rest%%.*}"
                if   [ "${nmj}" -gt "${pmj}" ]; then level="major"
                elif [ "${nmn}" -gt "${pmn}" ]; then level="minor"
                else                                 level="patch"
                fi
              fi
              ;;
            hotfix/*)
              # A hotfix is by SDLC §4's definition an emergency fix for a
              # critical production bug — that IS a patch. Always patch-bump
              # the latest tag; no PR label is read (labels play no part in
              # the release pipeline anymore — SDLC §5). A hotfix cannot
              # precede the first release, so a missing prev tag is an error
              # rather than a silent v0.1.0.
              level="patch"
              if [ -z "${prev}" ]; then
                echo "::error::hotfix/* merged but no release tag exists yet — a hotfix cannot precede the first release."
                exit 1
              fi
              export PREV="${prev}"
              next="$(node -e '
                const m = process.env.PREV.match(/^v(\d+)\.(\d+)\.(\d+)$/);
                if (!m) { console.error("unparseable prev tag:", process.env.PREV); process.exit(2); }
                let [maj, min, pat] = [+m[1], +m[2], +m[3]];
                pat++;
                process.stdout.write(`v${maj}.${min}.${pat}`);
              ')"
              ;;
            *)
              echo "::error::Unexpected head ref ${HEAD_REF} (expected release/* or hotfix/*)."
              exit 1
              ;;
          esac

          echo "next=${next}" >> "$GITHUB_OUTPUT"
          echo "level=${level}" >> "$GITHUB_OUTPUT"

      - name: Print resolved versions
        env:
          PREV: ${{ steps.version.outputs.prev }}
          NEXT: ${{ steps.version.outputs.next }}
          LEVEL: ${{ steps.version.outputs.level }}
        run: |
          echo "bump level : ${LEVEL}"
          echo "previous   : ${PREV:-<none — first release>}"
          echo "next       : ${NEXT}"

      - name: Tag the merge commit
        env:
          NEXT: ${{ steps.version.outputs.next }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/${NEXT}" >/dev/null; then
            echo "::error::Tag ${NEXT} already exists; not overwriting. Resolve before re-running."
            exit 1
          fi
          git tag -a "${NEXT}" -m "Release ${NEXT}" "${MERGE_SHA}"
          git push origin "${NEXT}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREV: ${{ steps.version.outputs.prev }}
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          # The tag was created + pushed in the previous step on the exact
          # merge commit, so gh release create just attaches the release to
          # that existing tag — no --target needed (and avoiding one sidesteps
          # a gh-version-specific error when --target meets a pre-existing tag).
          # --generate-notes derives the body from PR titles/commits since the
          # previous tag (or all history on first release). Using PR titles
          # avoids relying on Conventional-Commits merge messages and stays
          # generic for any repo. The PyPI upload happens later in this same
          # job, from the version-bumped tree — see the two publish steps.
          if [ -n "${PREV}" ]; then
            gh release create "${NEXT}" --title "${NEXT}" \
              --generate-notes --notes-start-tag "${PREV}"
          else
            gh release create "${NEXT}" --title "${NEXT}" \
              --generate-notes
          fi

      - name: Bump pyproject.toml version to ${NEXT}
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          # Strip leading 'v' from NEXT (e.g. v0.3.0 -> 0.3.0) — PEP 440 has no 'v' prefix.
          NEXT_NO_V="${NEXT#v}"
          # The previous steps ran on a detached merge_commit_sha; check out main.
          git checkout -B main origin/main
          # A targeted regex substitution rather than a TOML-writing
          # dependency for one field. The pattern is anchored at column zero,
          # and `version = ` appears exactly once that way in pyproject.toml
          # ([build-system] uses `requires`, [project.urls] uses its own
          # keys) — keep it that way, or this rewrites the wrong field.
          #
          # This step is what makes the PyPI publish below correct: the
          # tagged merge commit still carries development's last dev stamp
          # (e.g. 0.1.2-dev.5), so a build from *that* tree would upload a
          # PEP 440 dev release sorting BELOW the release it just tagged —
          # uncorrectable, because PyPI filenames are immutable. Everything
          # downstream therefore builds from this bumped tree, never from the
          # merge commit.
          sed -i -E 's/^version = ".*"$/version = "'"${NEXT_NO_V}"'"/' pyproject.toml
          grep -q "version = \"${NEXT_NO_V}\"" pyproject.toml
          git add pyproject.toml
          git commit -m "chore: bump version to ${NEXT_NO_V}"
          git push origin main

      # The distribution is built HERE, immediately after the bump, because
      # this is the only point in the job where the working tree carries the
      # release version. The upload itself is the last step of the job — see
      # the comment there for why the two are split.
      - name: Set up Python for the build
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build sdist + wheel and verify the version
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          NEXT_NO_V="${NEXT#v}"

          python -m pip install --upgrade pip
          python -m pip install build twine
          rm -rf dist build
          python -m build

          # Assert BEFORE uploading that what was built is the release that
          # was just tagged. PyPI filenames are immutable, so an upload of
          # the wrong version cannot be corrected by re-running — fail the
          # job loudly instead. Expect exactly the two expected filenames and
          # nothing else in dist/.
          whl="dist/cedit-${NEXT_NO_V}-py3-none-any.whl"
          sdist="dist/cedit-${NEXT_NO_V}.tar.gz"
          count="$(find dist -maxdepth 1 -type f | wc -l)"
          if [ "${count}" -ne 2 ] || [ ! -f "${whl}" ] || [ ! -f "${sdist}" ]; then
            echo "::error::Built artifacts do not match the resolved release ${NEXT}. Expected exactly ${whl} and ${sdist}. dist/ holds:"
            ls -1 dist
            exit 1
          fi

          twine check dist/*
          echo "artifacts verified against ${NEXT}:"
          ls -1 dist

      # AFTER the build, never before it. Invariant 6 in
      # .claude/rules/release-pipeline.md pins the build immediately behind
      # the version bump, because that is the only point at which the tree
      # carries the release version and a PyPI filename cannot be corrected
      # once uploaded. This step only adds files under website/, which the
      # distribution does not contain (tests/test_packaging.py asserts it),
      # so it has nothing to contribute to dist/ and every reason to stay
      # out of its way.
      #
      # Why version the docs at all: a hash-moving release is a breaking
      # change to consumers' on-disk .cedit/ state, so a reader still on an
      # older cedit needs the guide, the spec and the architecture map as
      # they stood for THAT version — not the ones describing a parser their
      # recorded hashes no longer match.
      #
      # `docusaurus docs:version X.Y.Z` snapshots ../docs into
      # website/versioned_docs/version-X.Y.Z/, writes the matching sidebar
      # and prepends the version to website/versions.json. All three are
      # committed; only node_modules/ and build/ are ignored.
      - name: Set up Node for the docs version cut
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Cut a docs version for ${{ steps.version.outputs.next }}
        id: docs_version
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          NEXT_NO_V="${NEXT#v}"

          # Already on main from the bump step, but be explicit: this commit
          # must land on main, not on the detached merge commit.
          git checkout main

          if [ -d "website/versioned_docs/version-${NEXT_NO_V}" ]; then
            echo "::notice::Docs version ${NEXT_NO_V} already exists; nothing to cut."
            echo "cut=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cd website
          npm ci
          npm run docs:version -- "${NEXT_NO_V}"
          cd ..

          git add website/versioned_docs website/versioned_sidebars website/versions.json
          git commit -m "docs: cut docs version ${NEXT_NO_V}"
          git push origin main
          echo "cut=${NEXT_NO_V}" >> "$GITHUB_OUTPUT"

      - name: Back-merge main into development
        id: sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          git fetch origin development
          git checkout -B development origin/development
          # --no-ff keeps the merge topology explicit (a real sync commit,
          # not a fast-forward that would hide that main moved).
          if git merge --no-ff origin/main -m "chore: sync main into development after ${NEXT}"; then
            git push origin development
            echo "synced=pushed" >> "$GITHUB_OUTPUT"
          else
            # Conflict -> never force-push. Abort, push a sync branch, open a
            # PR for a human to resolve (SDLC keeps the final merge human).
            git merge --abort
            sync_branch="sync/main-to-dev-${NEXT}"
            git checkout -B "${sync_branch}" origin/main
            git push -u origin "${sync_branch}"
            # Body intentionally backtick-free (unquoted heredoc, ${NEXT} expands).
            body=$(cat <<EOF
          Auto-opened by release.yml — back-merge of main into development
          after ${NEXT} conflicted and needs a human to resolve. SDLC §3
          Phase 4 step 6 / §4 Step 4 require this sync so the next sprint
          carries the release's QA fixes.
          EOF
          )
            url=$(gh pr create --base development --head "${sync_branch}" \
              --title "chore: sync main into development after ${NEXT}" \
              --body "${body}")
            echo "synced=${url}" >> "$GITHUB_OUTPUT"
            echo "::warning::Back-merge conflicted; opened PR for resolution: ${url}"
          fi

      - name: Delete the release/hotfix branch
        # SDLC §3 Phase 4 step 7. Acting on the PR's head ref (not a
        # hardcoded branch) and gated by the job-level `if:` release/* /
        # hotfix/* check, so main/development can never be targeted here.
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git push origin --delete "${HEAD_REF}"
          echo "::notice::Deleted branch ${HEAD_REF}"

      # Last, deliberately — dist/ is untracked so it survives the branch
      # checkouts above unchanged. The realistic failure here is the OIDC
      # exchange (no pending publisher configured on pypi.org yet), and that
      # is the one failure a human fixes outside this repo. Running it last
      # means such a failure leaves the tag, the GitHub Release, the version
      # bump, the back-merge and the branch cleanup all already done, with
      # only the upload left to do by hand. A genuine packaging bug still
      # fails fast, in the build+verify step above, before any of that.
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Job summary
        env:
          NEXT: ${{ steps.version.outputs.next }}
          PREV: ${{ steps.version.outputs.prev }}
          LEVEL: ${{ steps.version.outputs.level }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          SYNCED: ${{ steps.sync.outputs.synced }}
          DOCS_CUT: ${{ steps.docs_version.outputs.cut }}
        run: |
          {
            echo "## Release ${NEXT}"
            echo ""
            echo "- merged: \`${HEAD_REF}\` -> main"
            echo "- bump   : ${LEVEL} (from ${PREV:-<none>})"
            echo "- tag    : ${NEXT}"
            echo "- release: https://github.com/${{ github.repository }}/releases/tag/${NEXT}"
            echo "- pypi   : https://pypi.org/project/cedit/${NEXT#v}/"
            case "${DOCS_CUT}" in
              skipped) echo "- docs   : version already existed — nothing cut" ;;
              *)       echo "- docs   : cut docs version ${DOCS_CUT}" ;;
            esac
            case "${SYNCED}" in
              pushed) echo "- sync   : main -> development (pushed)" ;;
              *)      echo "- sync   : back-merge PR opened — ${SYNCED}" ;;
            esac
            echo "- cleanup: deleted \`${HEAD_REF}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # The docs version cut above is pushed by GITHUB_TOKEN, and a GITHUB_TOKEN
  # push emits no workflow runs (invariant 2), so docs.yml's `push` trigger
  # never sees that commit. This job is what tells it.
  #
  # It DISPATCHES rather than calling docs.yml as a reusable workflow, and
  # that is the whole design — see invariant 7 in
  # .claude/rules/release-pipeline.md. A called workflow runs in the caller's
  # context, so the deploy would inherit `refs/pull/<n>/merge` from this
  # workflow's pull_request trigger, and the `github-pages` environment
  # refuses every ref but `main`: the build succeeds and the deploy is
  # rejected. A dispatch instead creates its own run at `refs/heads/main`.
  # `workflow_dispatch` is also the documented exception to invariant 2 —
  # GITHUB_TOKEN cannot trigger by pushing, but it can always trigger by
  # dispatching.
  #
  # `!cancelled()` rather than the default `success()`: the release's last
  # step is the PyPI upload, whose realistic failure is an OIDC exchange a
  # human fixes on pypi.org, and by then the docs version has been cut and
  # pushed several steps ago. Gating on success would leave the site a
  # version behind for exactly that case, with no failed docs run to notice.
  # The `!= 'skipped'` half keeps an ordinary non-release PR merged into main
  # from republishing the site for nothing — that is when the release job's
  # own `if:` guard declines to run.
  publish-docs:
    name: Publish the docs site
    needs: release
    if: ${{ !cancelled() && needs.release.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write        # dispatching a workflow is an Actions write
    steps:
      - name: Dispatch the docs build against main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run "Docs site" --ref main --repo "${{ github.repository }}"
          echo "::notice::Dispatched 'Docs site' on main."
