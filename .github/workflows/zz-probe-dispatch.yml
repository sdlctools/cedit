# TEMPORARY — delete before this PR merges.
#
# Proves the one link in the publish-docs fix that cannot be tested any other
# way: that a job holding only `actions: write` and the default GITHUB_TOKEN
# can dispatch "Docs site" against main, and that the resulting run is allowed
# to deploy (its ref is refs/heads/main, not this PR's merge ref).
#
# It runs on pull_request because a workflow_dispatch trigger only works for
# workflows already on the default branch — which this one deliberately is
# not.
name: zz probe dispatch

on:
  pull_request:
    branches: [development]

permissions:
  actions: write

jobs:
  probe:
    name: Dispatch Docs site against main
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run "Docs site" --ref main --repo "${{ github.repository }}"
          echo "::notice::dispatched"
