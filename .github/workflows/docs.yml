# Builds website/ and deploys it to GitHub Pages.
#
# Path-filtered on purpose: the docs site has nothing to say about a change
# to cedit/ or tests/, and a site build on every source push is a minute of
# CI spent to publish the identical bytes. The filter is docs/**, website/**
# and this file — the three inputs the built site is a function of.
#
# Two triggers, and each exists for a different reason:
#
#   push (main, filtered) — the ordinary path. A merged PR that touched the
#     docs republishes them.
#   workflow_dispatch     — everything else, and it carries more weight than
#     "manual escape hatch" suggests: release.yml's publish-docs job fires
#     exactly this trigger, with --ref main, and it is also how a human
#     recovers a deploy that did not happen. A release cuts a docs version
#     and pushes it with GITHUB_TOKEN, and a GITHUB_TOKEN *push* triggers no
#     workflows (invariant 2 in .claude/rules/release-pipeline.md), so the
#     `push` trigger above never sees that commit. A GITHUB_TOKEN
#     *workflow_dispatch* is the documented exception that always does
#     create a run.
#
# THE REF IS THE WHOLE POINT, and it is why this is not a `workflow_call`.
# release.yml used to invoke this file as a reusable workflow. It published
# nothing, for a reason invisible in the YAML: a called workflow runs in the
# CALLER's context, so `github.ref` stayed `refs/pull/<n>/merge` from
# release.yml's pull_request trigger. The `github-pages` environment carries
# a deployment branch policy naming exactly one ref — `main` — so the build
# succeeded and the deploy was refused:
#
#   Branch "refs/pull/58/merge" is not allowed to deploy to github-pages
#   due to environment protection rules.
#
# Passing `ref: main` did not help and could not: that input only told
# actions/checkout what to fetch, while the environment gate reads the run's
# own ref, which no input can change. A dispatch creates its own run at
# `refs/heads/main`, which is the ref the environment allows.
#
# PRECONDITION, not fixable from this repository: Settings -> Pages -> Build
# and deployment -> Source must be set to "GitHub Actions". Until a human
# does that, actions/deploy-pages fails with "Get Pages site failed" and no
# amount of YAML here changes it.
name: Docs site

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'website/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Serialize deploys without cancelling one in flight: a half-deployed Pages
# site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build the Docusaurus site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # No explicit ref: every trigger already aims the run at the right
          # one. push is main by the filter above, and a dispatch runs at
          # whatever --ref named — main from release.yml, or a branch a human
          # is testing.
          # docs.showLastUpdateTime reads the git history of each file. A
          # shallow clone silently degrades that to "cannot infer the update
          # date" warnings and no timestamps on the page.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build
        working-directory: website
        # onBrokenLinks and markdown.hooks.onBrokenMarkdownLinks are both
        # 'throw' in docusaurus.config.js, so a cross-link that stopped
        # resolving fails here rather than shipping as a 404.
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload the site as a Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
